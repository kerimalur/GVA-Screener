name: ML Seed Factors (einmalig)
# Einmaliger Seed der factor_track-Historie (Projekt B). Manuell auslösen.
# VORHER die Migration create_factor_track in Supabase anwenden (Tabelle + View),
# sonst schlägt der Insert fehl. Insert-only: erneutes Ausführen schreibt 0 Zeilen.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: Backend/macro_features/cache
          key: ml-data-cache-${{ github.run_id }}
          restore-keys: ml-data-cache-
      - run: python -m ml_engine.seed_factors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
