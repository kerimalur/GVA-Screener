name: ML Nightly Search

# Am 2026-08-14 von woechentlich zurueck auf taeglich.
#
# Gedrosselt wurde am 25.07., weil die Suche ueber sechs Naechte und ~14.000
# Experimente auf demselben Ergebnis stand. Der Grund war aber nicht die
# Frequenz, sondern der Suchraum: Kern = {logreg} x {4W} x Teilmengen von
# {rates, scores} - drei Feature-Kombinationen bei einem deterministischen
# Modell. Das laesst sich in einer Nacht erschoepfen; jede weitere fand
# garantiert dasselbe.
#
# Der Raum ist jetzt erweitert (siehe ml_engine/search.py, Abschnitt
# "ERWEITERUNG 2026-08-14"): beide Algorithmen, zwei Horizonte, vier
# Feature-Gruppen, 40 Prozent Exploration. Damit lohnt sich taegliches Laufen
# wieder - es gibt etwas zu finden.
#
# Die Konvergenz-Erkennung (`stagnant`, STAGNATION_NIGHTS) bleibt der
# Waechter: Steht best_hall wieder fuenf Naechte still, meldet das Log es,
# und dann ist erneut der Raum dran und nicht die Frequenz.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: Backend/macro_features/cache
          key: ml-data-cache-${{ github.run_id }}
          restore-keys: ml-data-cache-
      - run: python -m ml_engine.run_experiments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ML_BUDGET_MIN: "50"
