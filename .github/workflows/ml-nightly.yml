name: ML Weekly Search

# Von täglich (02:00 UTC) auf wöchentlich gedrosselt am 2026-07-25.
#
# Grund ist NICHT, dass der Job kaputt wäre — er läuft sauber durch. Der
# Random-Search ist im aktuellen Suchraum auskonvergiert: über sechs Nächte und
# rund 14.000 Experimente hat sich das Ergebnis nicht mehr bewegt
# (logreg · 4W · rates+scores, hall_score 0.517). Zwei strukturelle Gründe:
#   1. run_experiments._search_panel() schneidet die letzten 104 Wochen ab
#      (Holdout-Disziplin) — neue Marktdaten erreichen die Suche zwei Jahre
#      lang gar nicht, das Suchpanel ist über Nächte hinweg identisch.
#   2. Das gewinnende Modell ist logreg und damit deterministisch: gleiche
#      Config + gleiches Panel = bitgenau dieselbe Zahl, egal welcher Seed.
#
# Sobald der Suchraum erweitert wird (weitere Features, Horizonte,
# Modellfamilien), kann die Frequenz wieder hoch. workflow_dispatch bleibt,
# manuelle Läufe sind jederzeit möglich. Die Konvergenz-Erkennung in
# run_experiments._is_stagnant() meldet so einen Zustand künftig selbst
# (Flag `stagnant` in ml_engine_nights, sichtbar im Engine-Log).
on:
  schedule:
    - cron: "0 2 * * 0"    # sonntags 02:00 UTC
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: Backend/macro_features/cache
          key: ml-data-cache-${{ github.run_id }}
          restore-keys: ml-data-cache-
      - run: python -m ml_engine.run_experiments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ML_BUDGET_MIN: "50"
