name: Render Keep-Alive

# Render Free Tier schläft nach 15 min Inaktivität (→ ~50 s Kaltstart).
# Ping alle 10 min hält den Service wach. GH-Cron kann sich verzögern —
# der Login-Warmup im Frontend (Prefetcher) fängt den Rest ab.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        id: ping
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://gva-screener.onrender.com/api/health) && \
            [ "$code" = "200" ] && { echo "ok (Versuch $i)"; exit 0; }
            echo "Versuch $i: HTTP ${code:-timeout} — retry in 10 s"
            sleep 10
          done
          echo "Backend antwortet nicht (nach 3 Versuchen)"; exit 1

      # Schlägt der Ping fehl, meldet der vorhandene Bot den Ausfall. Ohne
      # gesetzte Secrets wird die Meldung übersprungen (Workflow-Ergebnis bleibt
      # der Ping-Fehlschlag). Läuft alle 10 min — bei längerem Ausfall bewusst
      # je Lauf eine Meldung (stateless, keine Entwarnung).
      - name: Telegram-Alarm bei Ausfall
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Keine Telegram-Secrets gesetzt — Alarm übersprungen."; exit 0
          fi
          curl -s --max-time 15 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="🔴 *GVA-Backend nicht erreichbar* — /api/health antwortet nach 3 Versuchen nicht. Render evtl. down oder Kaltstart-Fehler."
