name: ML Holdout Validation

# NUR manuell — bewusst kein schedule.
#
# Ein Holdout wirkt nur, solange man ihn selten befragt. Wer ihn nach Plan
# laufen lässt und jedes Mal die beste Config nimmt, hat den Selection Bias
# bloss verlagert. Deshalb: workflow_dispatch, ein Knopf, mit Absicht gedrückt.
#
# Der Runner zählt die bisherigen Läufe selbst (ml_holdout_results.run_index).
# Ab Lauf 2 bricht er hier ab, weil GitHub Actions keine interaktive Rückfrage
# erlaubt — dann braucht es bewusst `bestaetigen: true`.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur rechnen, nichts schreiben (kein run_index verbraucht)"
        type: boolean
        default: true
      top_families:
        description: "Zusätzlich die N besten Modellfamilien der Suche (0 = nur stabile Config + Baselines)"
        type: string
        default: "0"
      bestaetigen:
        description: "Ab dem 2. Lauf zwingend: Ich weiss, dass jede weitere Befragung die Aussagekraft senkt"
        type: boolean
        default: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt

      # Panel-Aufbau zieht FRED/CFTC — derselbe Cache wie die wöchentliche Suche.
      - uses: actions/cache@v4
        with:
          path: Backend/macro_features/cache
          key: ml-data-cache-${{ github.run_id }}
          restore-keys: ml-data-cache-

      - name: Holdout auswerten
        run: |
          # pipefail: ohne das würde `| tee` den Exit-Code des Runners
          # verschlucken — ein Abbruch (z.B. fehlende Bestätigung ab Lauf 2)
          # liefe dann als grüner Job durch.
          set -eo pipefail
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.bestaetigen }}" = "true" ]; then
            ARGS="$ARGS --i-know-what-im-doing"
          fi
          if [ "${{ inputs.top_families }}" != "0" ] && [ -n "${{ inputs.top_families }}" ]; then
            ARGS="$ARGS --top-families ${{ inputs.top_families }}"
          fi
          echo "python -m ml_engine.run_holdout$ARGS"
          python -m ml_engine.run_holdout $ARGS | tee holdout-report.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # Die Tabelle direkt in der Job-Summary — ohne Log-Scrollen ablesbar.
      - name: Bericht in die Job-Summary
        if: always()
        run: |
          {
            echo "### Holdout-Validierung"
            echo ""
            echo "Modus: ${{ inputs.dry_run == true && 'dry-run (nichts geschrieben)' || 'geschrieben nach ml_holdout_results' }}"
            echo ""
            echo '```'
            cat holdout-report.txt 2>/dev/null || echo "kein Bericht — Lauf abgebrochen (siehe Log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdout-report
          path: Backend/holdout-report.txt
          if-no-files-found: ignore
