name: ML Weekly Ranking
on:
  schedule:
    - cron: "0 8 * * 6"    # Samstag 08:00 UTC, nach COT-Release Freitag
  workflow_dispatch:

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: Backend/macro_features/cache
          key: ml-data-cache-${{ github.run_id }}
          restore-keys: ml-data-cache-
      - run: python -m ml_engine.run_weekly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
